name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS
        run: pio run -e tars

      - name: Build LittleFS
        run: pio run -e tars -t buildfs

      - name: Create merged firmware
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          BOOT_APP0=$(find "$HOME/.platformio/packages/framework-arduinoespressif32" \
            -name "boot_app0.bin" \
            | head -n 1)

          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin tidak ditemukan"
            exit 1
          fi

          echo "Bootloader : $BUILD/bootloader/bootloader.bin"
          echo "Partitions : $BUILD/partitions.bin"
          echo "Boot App0  : $BOOT_APP0"
          echo "Firmware   : $BUILD/firmware.bin"
          echo "LittleFS   : $BUILD/littlefs.bin"

          python -m esptool \
            --chip esp32 merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BUILD/bootloader/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x2A0000 "$BUILD/littlefs.bin"

      - name: Verify merged firmware
        shell: bash
        run: |
          ls -lh TARS-ESP32.bin

          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"
          size = os.path.getsize(path)

          print("TARS-ESP32.bin:", size, "bytes")
          print("TARS-ESP32.bin:", round(size / 1024 / 1024, 2), "MB")

          if size > 0x400000:
              raise SystemExit("ERROR: firmware melebihi kapasitas flash 4MB")

          print("OK: ukuran firmware cocok untuk flash 4MB")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
