name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS firmware
        run: |
          pio run -e tars

      - name: Build LittleFS
        run: |
          pio run -e tars -t buildfs

      - name: Generate bootloader
        shell: bash
        run: |
          echo "=== Generating ESP32 bootloader ==="

          pio run -e tars -t bootloader

          echo ""
          echo "=== Searching generated bootloader ==="

          find .pio -type f -name "bootloader.bin" -print

          BOOTLOADER=$(find .pio -type f -name "bootloader.bin" | head -n 1)

          if [ -z "$BOOTLOADER" ]; then
            echo "ERROR: bootloader.bin tidak berhasil dibuat"
            exit 1
          fi

          echo "BOOTLOADER=$BOOTLOADER" >> "$GITHUB_ENV"

          echo "Bootloader ditemukan:"
          echo "$BOOTLOADER"

      - name: Locate boot_app0
        shell: bash
        run: |
          BOOT_APP0=$(find "$HOME/.platformio/packages" \
            -type f \
            -name "boot_app0.bin" \
            | head -n 1)

          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin tidak ditemukan"
            exit 1
          fi

          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"

          echo "Boot App0 ditemukan:"
          echo "$BOOT_APP0"

      - name: Locate esptool
        shell: bash
        run: |
          ESPTOOL=$(find "$HOME/.platformio/packages/tool-esptoolpy" \
            -type f \
            \( -name "esptool.py" -o -name "esptool" \) \
            | head -n 1)

          if [ -z "$ESPTOOL" ]; then
            echo "ERROR: esptool tidak ditemukan"
            exit 1
          fi

          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"

          echo "Esptool:"
          echo "$ESPTOOL"

      - name: Verify build files
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "VERIFY BUILD FILES"
          echo "========================================"

          test -f "$BOOTLOADER" || {
            echo "ERROR: bootloader.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/partitions.bin" || {
            echo "ERROR: partitions.bin tidak ada"
            exit 1
          }

          test -f "$BOOT_APP0" || {
            echo "ERROR: boot_app0.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/firmware.bin" || {
            echo "ERROR: firmware.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/littlefs.bin" || {
            echo "ERROR: littlefs.bin tidak ada"
            exit 1
          }

          echo ""
          echo "Semua file tersedia:"
          echo ""

          ls -lh "$BOOTLOADER"
          ls -lh "$BUILD/partitions.bin"
          ls -lh "$BOOT_APP0"
          ls -lh "$BUILD/firmware.bin"
          ls -lh "$BUILD/littlefs.bin"

      - name: Create merged firmware
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "MERGING TARS FIRMWARE"
          echo "========================================"

          python "$ESPTOOL" \
            --chip esp32 merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BOOTLOADER" \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x2A0000 "$BUILD/littlefs.bin"

          echo ""
          echo "========================================"
          echo "MERGE BERHASIL"
          echo "========================================"

          ls -lh TARS-ESP32.bin

      - name: Verify final firmware
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"

          if not os.path.isfile(path):
              raise SystemExit("ERROR: TARS-ESP32.bin tidak ditemukan")

          size = os.path.getsize(path)

          print("========================================")
          print("FINAL FIRMWARE")
          print("========================================")
          print("File   :", path)
          print("Bytes  :", size)
          print("MB     :", round(size / 1024 / 1024, 2))
          print("Flash  : 4 MB")

          if size > 0x400000:
              raise SystemExit(
                  "ERROR: TARS-ESP32.bin melebihi flash 4 MB"
              )

          print("")
          print("OK: firmware berada dalam batas flash 4 MB")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
