[platformio]
src_dir = .
include_dir = include

[env:tars]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

board_build.embed_files =
    src/alarm.mp3
    src/online.mp3
    src/offline.mp3
    src/follow.mp3
    src/mundur.mp3
    src/maju.mp3
    src/angkat.mp3
    src/hari.mp3
    src/pagi.mp3
    src/siang.mp3
    src/sore.mp3
    src/malam.mp3

build_src_filter =
    +<src/main.cpp>
    +<src/wifi_manager.cpp>
    +<src/vision_live.cpp>
    +<tars_auto/*.cpp>
    +<tars_roda/Wheels.cpp>
    -<.pio/>
    -<.git/>

lib_deps =
    https://github.com/Links2004/arduinoWebSockets.git
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.6
    https://github.com/pschatzmann/arduino-libhelix.git
    https://github.com/bitbank2/JPEGENC.git
    bblanchon/ArduinoJson
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

build_unflags =
    -std=gnu++11

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -Iinclude
    -Isrc
    -Itars_auto
    -Itars_roda
    -Ilib/TARS-OV7670

extra_scripts = pre:patch_ov7670.py
