
name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Verify partition table
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "VERIFY PARTITION TABLE"
          echo "========================================"

          cat partitions.csv

          grep -Eq '^spiffs,[[:space:]]*data,[[:space:]]*spiffs,[[:space:]]*0x380000,[[:space:]]*0x80000' partitions.csv || {
            echo "ERROR: Partisi LittleFS tidak sesuai!"
            echo "Harus:"
            echo "spiffs,data,spiffs,0x380000,0x80000"
            exit 1
          }

          echo "OK - partisi LittleFS 512 KB sesuai"

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS firmware
        shell: bash
        run: |
          pio run -e tars

      - name: Build LittleFS
        shell: bash
        run: |
          pio run -e tars -t buildfs

      - name: Locate ESP32 tools
        shell: bash
        run: |
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          BOOTLOADER_ELF="$FRAMEWORK/tools/sdk/esp32/bin/bootloader_dio_40m.elf"
          BOOT_APP0="$FRAMEWORK/tools/partitions/boot_app0.bin"

          for FILE in "$BOOTLOADER_ELF" "$BOOT_APP0" "$ESPTOOL"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: File tidak ditemukan: $FILE"
              exit 1
            fi
          done

          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "BOOTLOADER_ELF=$BOOTLOADER_ELF" >> "$GITHUB_ENV"
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"

          echo "ESP32 tools ditemukan."

      - name: Convert bootloader ELF to BIN
        shell: bash
        run: |
          set -e

          python "$ESPTOOL" \
            --chip esp32 \
            elf2image \
            "$BOOTLOADER_ELF" \
            -o bootloader.bin

          if [ ! -s bootloader.bin ]; then
            echo "ERROR: bootloader.bin gagal dibuat"
            exit 1
          fi

          echo "OK - bootloader.bin berhasil dibuat"

      - name: Verify build files
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "VERIFY BUILD FILES"
          echo "========================================"

          for FILE in \
            bootloader.bin \
            "$BUILD/partitions.bin" \
            "$BUILD/firmware.bin" \
            "$BUILD/littlefs.bin" \
            "$BOOT_APP0"
          do
            if [ -s "$FILE" ]; then
              echo "OK: $FILE"
              ls -lh "$FILE"
            else
              echo "ERROR: File hilang atau kosong: $FILE"
              echo "Isi folder build:"
              ls -lah "$BUILD" || true
              exit 1
            fi
          done

          echo "OK - semua file build tersedia"

      - name: Verify image sizes
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          PART_SIZE=$(stat -c%s "$BUILD/partitions.bin")
          FW_SIZE=$(stat -c%s "$BUILD/firmware.bin")
          FS_SIZE=$(stat -c%s "$BUILD/littlefs.bin")

          echo "Partition table : $PART_SIZE bytes"
          echo "Firmware        : $FW_SIZE bytes"
          echo "LittleFS        : $FS_SIZE bytes"

          if [ "$PART_SIZE" -gt 4096 ]; then
            echo "ERROR: Partition table terlalu besar"
            exit 1
          fi

          if [ "$FW_SIZE" -gt $((0x370000)) ]; then
            echo "ERROR: Firmware melewati batas area aplikasi"
            exit 1
          fi

          if [ "$FS_SIZE" -gt $((0x80000)) ]; then
            echo "ERROR: LittleFS melebihi 512 KB"
            exit 1
          fi

          echo "OK - ukuran seluruh image sesuai"

      - name: Merge TARS firmware
        shell: bash
        run: |
          set -e
          BUILD=".pio/build/tars"

          python "$ESPTOOL" \
            --chip esp32 \
            merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x380000 "$BUILD/littlefs.bin"

          echo "OK - proses merge selesai"

      - name: Verify final BIN
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"

          if not os.path.isfile(path):
              raise SystemExit("ERROR: TARS-ESP32.bin tidak ditemukan")

          size = os.path.getsize(path)

          print("========================================")
          print("TARS FINAL FIRMWARE")
          print("========================================")
          print("File :", path)
          print("Size :", size, "bytes")
          print("Size :", round(size / 1024 / 1024, 2), "MB")
          print("----------------------------------------")
          print("Flash           : 4 MB")
          print("Firmware offset : 0x10000")
          print("Firmware limit  : 0x370000")
          print("LittleFS offset : 0x380000")
          print("LittleFS size   : 0x80000 (512 KB)")
          print("----------------------------------------")

          if size > 0x400000:
              raise SystemExit("ERROR: BIN melebihi 4 MB")

          if size != 0x400000:
              raise SystemExit("ERROR: merged BIN bukan 4 MB penuh")

          print("OK - merged BIN tepat 4 MB")
          print("OK - layout flash sesuai")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
