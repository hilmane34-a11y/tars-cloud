name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS firmware
        run: |
          pio run -e tars

      - name: Build LittleFS
        run: |
          pio run -e tars -t buildfs

      - name: Locate ESP32 tools
        shell: bash
        run: |
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          BOOTLOADER_ELF="$FRAMEWORK/tools/sdk/esp32/bin/bootloader_dio_40m.elf"
          BOOT_APP0="$FRAMEWORK/tools/partitions/boot_app0.bin"

          if [ ! -f "$BOOTLOADER_ELF" ]; then
            echo "ERROR: bootloader_dio_40m.elf tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$ESPTOOL" ]; then
            echo "ERROR: esptool.py tidak ditemukan"
            exit 1
          fi

          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "BOOTLOADER_ELF=$BOOTLOADER_ELF" >> "$GITHUB_ENV"
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"

          echo "Framework:"
          echo "$FRAMEWORK"

          echo "Bootloader ELF:"
          echo "$BOOTLOADER_ELF"

          echo "Boot App0:"
          echo "$BOOT_APP0"

          echo "Esptool:"
          echo "$ESPTOOL"

      - name: Convert bootloader ELF to BIN
        shell: bash
        run: |
          echo "========================================"
          echo "CONVERTING BOOTLOADER ELF"
          echo "========================================"

          python "$ESPTOOL" \
            --chip esp32 \
            elf2image \
            "$BOOTLOADER_ELF" \
            -o bootloader.bin

          if [ ! -f bootloader.bin ]; then
            echo "ERROR: bootloader.bin gagal dibuat"
            exit 1
          fi

          echo ""
          echo "Bootloader berhasil dibuat:"
          ls -lh bootloader.bin

      - name: Verify build files
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "VERIFY BUILD FILES"
          echo "========================================"

          test -f bootloader.bin || {
            echo "ERROR: bootloader.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/partitions.bin" || {
            echo "ERROR: partitions.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/firmware.bin" || {
            echo "ERROR: firmware.bin tidak ada"
            exit 1
          }

          test -f "$BUILD/littlefs.bin" || {
            echo "ERROR: littlefs.bin tidak ada"
            exit 1
          }

          test -f "$BOOT_APP0" || {
            echo "ERROR: boot_app0.bin tidak ada"
            exit 1
          }

          echo ""
          echo "Semua file tersedia:"
          echo ""

          ls -lh bootloader.bin
          ls -lh "$BUILD/partitions.bin"
          ls -lh "$BUILD/firmware.bin"
          ls -lh "$BUILD/littlefs.bin"
          ls -lh "$BOOT_APP0"

      - name: Merge TARS firmware
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "MERGING TARS ESP32 FIRMWARE"
          echo "========================================"

          python "$ESPTOOL" \
            --chip esp32 \
            merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x2A0000 "$BUILD/littlefs.bin"

          echo ""
          echo "========================================"
          echo "MERGE BERHASIL"
          echo "========================================"

          ls -lh TARS-ESP32.bin

      - name: Verify final BIN
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"

          if not os.path.isfile(path):
              raise SystemExit("ERROR: TARS-ESP32.bin tidak ditemukan")

          size = os.path.getsize(path)

          print("========================================")
          print("TARS FINAL FIRMWARE")
          print("========================================")
          print("File :", path)
          print("Size :", size, "bytes")
          print("Size :", round(size / 1024 / 1024, 2), "MB")
          print("Flash: 4 MB")

          if size > 0x400000:
              raise SystemExit(
                  "ERROR: TARS-ESP32.bin melebihi kapasitas flash 4 MB"
              )

          print("")
          print("OK - firmware berada dalam batas 4 MB")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
