name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Verify partition table
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY PARTITION TABLE"
          echo "========================================"

          cat partitions.csv

          grep -Eq '^spiffs,[[:space:]]*data,[[:space:]]*spiffs,[[:space:]]*0x380000,[[:space:]]*0x80000' partitions.csv || {
            echo "ERROR: Partisi LittleFS tidak sesuai!"
            echo "Harus:"
            echo "spiffs,data,spiffs,0x380000,0x80000"
            exit 1
          }

          echo "OK - partisi LittleFS 512 KB sesuai"

      - name: Verify required MP3 files
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY TARS MP3 ASSETS"
          echo "========================================"

          MP3_FILES=(
            "src/online.mp3"
            "src/offline.mp3"
            "src/follow.mp3"
            "src/mundur.mp3"
            "src/maju.mp3"
            "src/angkat.mp3"
          )

          for file in "${MP3_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: MP3 tidak ditemukan: $file"
              exit 1
            fi

            SIZE=$(stat -c%s "$file")

            if [ "$SIZE" -eq 0 ]; then
              echo "ERROR: MP3 kosong: $file"
              exit 1
            fi

            echo "OK: $file ($SIZE bytes)"
          done

          echo "Semua 6 MP3 tersedia."

      - name: Embed TARS MP3 into firmware
        shell: bash
        run: |
          echo "========================================"
          echo "EMBED TARS MP3"
          echo "========================================"

          cat > src/tars_mp3.S <<EOF
          .section .rodata.tars_mp3,"a",@progbits

          .global _binary_src_online_mp3_start
          .global _binary_src_online_mp3_end
          .type _binary_src_online_mp3_start,@object
          .type _binary_src_online_mp3_end,@object
          _binary_src_online_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/online.mp3"
          _binary_src_online_mp3_end:

          .global _binary_src_offline_mp3_start
          .global _binary_src_offline_mp3_end
          .type _binary_src_offline_mp3_start,@object
          .type _binary_src_offline_mp3_end,@object
          _binary_src_offline_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/offline.mp3"
          _binary_src_offline_mp3_end:

          .global _binary_src_follow_mp3_start
          .global _binary_src_follow_mp3_end
          .type _binary_src_follow_mp3_start,@object
          .type _binary_src_follow_mp3_end,@object
          _binary_src_follow_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/follow.mp3"
          _binary_src_follow_mp3_end:

          .global _binary_src_mundur_mp3_start
          .global _binary_src_mundur_mp3_end
          .type _binary_src_mundur_mp3_start,@object
          .type _binary_src_mundur_mp3_end,@object
          _binary_src_mundur_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/mundur.mp3"
          _binary_src_mundur_mp3_end:

          .global _binary_src_maju_mp3_start
          .global _binary_src_maju_mp3_end
          .type _binary_src_maju_mp3_start,@object
          .type _binary_src_maju_mp3_end,@object
          _binary_src_maju_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/maju.mp3"
          _binary_src_maju_mp3_end:

          .global _binary_src_angkat_mp3_start
          .global _binary_src_angkat_mp3_end
          .type _binary_src_angkat_mp3_start,@object
          .type _binary_src_angkat_mp3_end,@object
          _binary_src_angkat_mp3_start:
          .incbin "${GITHUB_WORKSPACE}/src/angkat.mp3"
          _binary_src_angkat_mp3_end:
          EOF

          echo "Generated src/tars_mp3.S:"
          cat src/tars_mp3.S

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS firmware
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD TARS FIRMWARE"
          echo "========================================"

          pio run -e tars

      - name: Build LittleFS
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD LITTLEFS 512 KB"
          echo "========================================"

          pio run -e tars -t buildfs

      - name: Locate ESP32 tools
        shell: bash
        run: |
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          BOOTLOADER_ELF="$FRAMEWORK/tools/sdk/esp32/bin/bootloader_dio_40m.elf"
          BOOT_APP0="$FRAMEWORK/tools/partitions/boot_app0.bin"

          test -f "$BOOTLOADER_ELF" || {
            echo "ERROR: bootloader_dio_40m.elf tidak ditemukan"
            exit 1
          }

          test -f "$BOOT_APP0" || {
            echo "ERROR: boot_app0.bin tidak ditemukan"
            exit 1
          }

          test -f "$ESPTOOL" || {
            echo "ERROR: esptool.py tidak ditemukan"
            exit 1
          }

          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "BOOTLOADER_ELF=$BOOTLOADER_ELF" >> "$GITHUB_ENV"
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"

      - name: Convert bootloader ELF to BIN
        shell: bash
        run: |
          python "$ESPTOOL" \
            --chip esp32 \
            elf2image \
            "$BOOTLOADER_ELF" \
            -o bootloader.bin

          test -f bootloader.bin

      - name: Verify build files
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          test -f bootloader.bin
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/littlefs.bin"
          test -f "$BOOT_APP0"

          echo "========================================"
          echo "BUILD FILES"
          echo "========================================"

          ls -lh bootloader.bin
          ls -lh "$BUILD/partitions.bin"
          ls -lh "$BUILD/firmware.bin"
          ls -lh "$BUILD/littlefs.bin"
          ls -lh "$BOOT_APP0"

      - name: Verify firmware size
        shell: bash
        run: |
          BUILD=".pio/build/tars"
          SIZE=$(stat -c%s "$BUILD/firmware.bin")

          echo "========================================"
          echo "VERIFY FIRMWARE SIZE"
          echo "========================================"
          echo "Firmware : $SIZE bytes"
          echo "Maximum  : 3604480 bytes"
          echo "Maximum  : 3.4375 MB"

          if [ "$SIZE" -gt 3604480 ]; then
            echo "ERROR: Firmware melebihi ruang app 0x370000"
            exit 1
          fi

          echo "OK - firmware muat dalam partisi 3.4375 MB"

      - name: Verify LittleFS image size
        shell: bash
        run: |
          BUILD=".pio/build/tars"
          SIZE=$(stat -c%s "$BUILD/littlefs.bin")

          echo "========================================"
          echo "VERIFY LITTLEFS SIZE"
          echo "========================================"
          echo "LittleFS : $SIZE bytes"
          echo "Maximum  : 524288 bytes"
          echo "Maximum  : 512 KB"

          if [ "$SIZE" -gt 524288 ]; then
            echo "ERROR: LittleFS melebihi 512 KB"
            exit 1
          fi

          echo "OK - LittleFS berada dalam batas 512 KB"

      - name: Verify embedded MP3 symbols
        shell: bash
        run: |
          BUILD=".pio/build/tars/firmware.elf"

          echo "========================================"
          echo "VERIFY EMBEDDED MP3 SYMBOLS"
          echo "========================================"

          SYMBOLS=(
            "_binary_src_online_mp3_start"
            "_binary_src_online_mp3_end"
            "_binary_src_offline_mp3_start"
            "_binary_src_offline_mp3_end"
            "_binary_src_follow_mp3_start"
            "_binary_src_follow_mp3_end"
            "_binary_src_mundur_mp3_start"
            "_binary_src_mundur_mp3_end"
            "_binary_src_maju_mp3_start"
            "_binary_src_maju_mp3_end"
            "_binary_src_angkat_mp3_start"
            "_binary_src_angkat_mp3_end"
          )

          for symbol in "${SYMBOLS[@]}"; do
            if ! xtensa-esp32-elf-nm "$BUILD" | grep -q "$symbol"; then
              echo "ERROR: Symbol MP3 tidak ditemukan: $symbol"
              exit 1
            fi

            echo "OK: $symbol"
          done

          echo "Semua simbol MP3 berhasil di-embed."

      - name: Merge TARS firmware
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          echo "========================================"
          echo "MERGE TARS 4 MB"
          echo "========================================"

          python "$ESPTOOL" \
            --chip esp32 \
            merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x380000 "$BUILD/littlefs.bin"

      - name: Verify final BIN
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"
          size = os.path.getsize(path)

          print("========================================")
          print("TARS FINAL FIRMWARE")
          print("========================================")
          print("File            :", path)
          print("Size            :", size, "bytes")
          print("Size            :", round(size / 1024 / 1024, 2), "MB")
          print("----------------------------------------")
          print("Flash           : 4 MB")
          print("Firmware offset : 0x10000")
          print("Firmware size   : 0x370000 (3.4375 MB)")
          print("LittleFS offset : 0x380000")
          print("LittleFS size   : 0x80000 (512 KB)")
          print("Flash end       : 0x400000")
          print("----------------------------------------")

          if size > 0x400000:
              raise SystemExit("ERROR: BIN melebihi 4 MB")

          if size != 0x400000:
              raise SystemExit("ERROR: merged BIN bukan 4 MB penuh")

          print("OK - merged BIN tepat 4 MB")
          print("OK - layout flash sesuai")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
