name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Verify partition table
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY PARTITION TABLE"
          echo "========================================"

          test -f partitions.csv || {
            echo "ERROR: partitions.csv tidak ditemukan"
            exit 1
          }

          cat partitions.csv

          grep -Eq '^spiffs,[[:space:]]*data,[[:space:]]*spiffs,[[:space:]]*0x380000,[[:space:]]*0x80000' partitions.csv || {
            echo "ERROR: Partisi LittleFS tidak sesuai!"
            echo "Harus:"
            echo "spiffs,data,spiffs,0x380000,0x80000"
            exit 1
          }

          echo "OK - partisi LittleFS 512 KB sesuai"

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Diagnose TARS source
        shell: bash
        run: |
          echo "========================================"
          echo "TARS SOURCE DIAGNOSTIC"
          echo "========================================"

          echo "COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "FILE CHECK:"
          test -f src/main.cpp || {
            echo "ERROR: src/main.cpp tidak ditemukan"
            exit 1
          }

          echo "Source size:"
          wc -l src/main.cpp

          echo ""
          echo "===== MAIN.CPP LINES 220-310 ====="
          nl -ba src/main.cpp | sed -n '220,310p'

          echo ""
          echo "===== CAMERA FUNCTION DECLARATIONS ====="
          grep -n -A65 -B8 -E 'drawCameraOLED|cameraTask' src/main.cpp || true

          echo ""
          echo "===== CAMERA FUNCTION BRACE MARKERS ====="
          grep -n -E 'drawCameraOLED|cameraTask|VISION' src/main.cpp || true

          echo ""
          echo "===== PREPROCESSOR DIRECTIVES ====="
          grep -n -E '^[[:space:]]*#[[:space:]]*(if|ifdef|ifndef|else|elif|endif)' src/main.cpp || true

          echo ""
          echo "SOURCE DIAGNOSTIC COMPLETE"

      - name: Build TARS firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e tars 2>&1 | tee build.log

      - name: Build LittleFS
        shell: bash
        run: |
          set -o pipefail
          pio run -e tars -t buildfs 2>&1 | tee buildfs.log

      - name: Locate ESP32 tools
        shell: bash
        run: |
          set -e

          BUILD="$GITHUB_WORKSPACE/.pio/build/tars"
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          TOOL_DIR="$HOME/.platformio/packages/tool-esptoolpy"

          echo "========================================"
          echo "LOCATE ESP32 TOOLS"
          echo "========================================"

          test -d "$BUILD" || {
            echo "ERROR: direktori build tidak ditemukan: $BUILD"
            exit 1
          }

          echo ""
          echo "Mencari bootloader.bin..."

          BOOTLOADER_BIN=""

          for FILE in \
            "$BUILD/bootloader.bin" \
            "$BUILD/bootloader/bootloader.bin"
          do
            if [ -f "$FILE" ]; then
              BOOTLOADER_BIN="$FILE"
              break
            fi
          done

          if [ -z "$BOOTLOADER_BIN" ]; then
            BOOTLOADER_BIN="$(find "$BUILD" -type f -name 'bootloader.bin' -print -quit)"
          fi

          if [ -z "$BOOTLOADER_BIN" ]; then
            echo "ERROR: bootloader.bin tidak ditemukan."
            echo "Isi direktori build:"
            find "$BUILD" -maxdepth 4 -type f -print | sort
            exit 1
          fi

          echo "Bootloader ditemukan: $BOOTLOADER_BIN"

          echo ""
          echo "Mencari boot_app0.bin..."

          BOOT_APP0=""

          for FILE in \
            "$FRAMEWORK/tools/partitions/boot_app0.bin" \
            "$HOME/.platformio/packages/framework-arduinoespressif32-libs/tools/partitions/boot_app0.bin"
          do
            if [ -f "$FILE" ]; then
              BOOT_APP0="$FILE"
              break
            fi
          done

          if [ -z "$BOOT_APP0" ]; then
            BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name 'boot_app0.bin' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin tidak ditemukan."
            find "$HOME/.platformio/packages" -type f -name 'boot_app0.bin' -print 2>/dev/null || true
            exit 1
          fi

          echo "boot_app0 ditemukan: $BOOT_APP0"

          echo ""
          echo "Mencari esptool..."

          ESPTOOL=""

          if [ -d "$TOOL_DIR" ]; then
            ESPTOOL="$(find "$TOOL_DIR" -type f \( -name 'esptool.py' -o -name 'esptool' \) -print -quit)"
          fi

          if [ -z "$ESPTOOL" ]; then
            echo "esptool tidak ditemukan di paket PlatformIO."
            echo "Memasang esptool Python..."
            python -m pip install esptool
            ESPTOOL_MODE="python-module"
          else
            echo "esptool ditemukan: $ESPTOOL"

            case "$ESPTOOL" in
              *.py)
                ESPTOOL_MODE="python-script"
                ;;
              *)
                ESPTOOL_MODE="executable"
                ;;
            esac
          fi

          echo "BOOTLOADER_BIN=$BOOTLOADER_BIN" >> "$GITHUB_ENV"
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"
          echo "ESPTOOL_MODE=$ESPTOOL_MODE" >> "$GITHUB_ENV"

          echo ""
          echo "Mode esptool: $ESPTOOL_MODE"
          echo "ESP32 tools berhasil diperiksa."

      - name: Verify build files
        shell: bash
        run: |
          set -e

          BUILD=".pio/build/tars"

          for FILE in \
            "$BOOTLOADER_BIN" \
            "$BUILD/partitions.bin" \
            "$BUILD/firmware.bin" \
            "$BUILD/littlefs.bin" \
            "$BOOT_APP0"
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: file build tidak ditemukan: $FILE"
              exit 1
            fi
          done

          echo "Build files:"
          ls -lh "$BOOTLOADER_BIN"
          ls -lh "$BUILD/partitions.bin"
          ls -lh "$BUILD/firmware.bin"
          ls -lh "$BUILD/littlefs.bin"
          ls -lh "$BOOT_APP0"

      - name: Verify LittleFS image size
        shell: bash
        run: |
          set -e

          BUILD=".pio/build/tars"
          SIZE=$(stat -c%s "$BUILD/littlefs.bin")

          echo "LittleFS image size: $SIZE bytes"
          echo "Expected maximum: 524288 bytes"

          if [ "$SIZE" -gt 524288 ]; then
            echo "ERROR: LittleFS melebihi 512 KB"
            exit 1
          fi

          echo "OK - LittleFS berada dalam batas 512 KB"

      - name: Merge TARS firmware
        shell: bash
        run: |
          set -e

          BUILD=".pio/build/tars"

          run_esptool() {
            case "$ESPTOOL_MODE" in
              python-script)
                python "$ESPTOOL" "$@"
                ;;
              executable)
                "$ESPTOOL" "$@"
                ;;
              python-module)
                python -m esptool "$@"
                ;;
              *)
                echo "ERROR: mode esptool tidak dikenal: $ESPTOOL_MODE"
                return 1
                ;;
            esac
          }

          echo "========================================"
          echo "MERGE TARS FIRMWARE"
          echo "========================================"

          run_esptool \
            --chip esp32 \
            merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 "$BOOTLOADER_BIN" \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x380000 "$BUILD/littlefs.bin"

          test -s TARS-ESP32.bin

          echo "Merge selesai."
          ls -lh TARS-ESP32.bin

      - name: Verify final BIN
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"

          if not os.path.isfile(path):
              raise SystemExit("ERROR: TARS-ESP32.bin tidak ditemukan")

          size = os.path.getsize(path)

          print("========================================")
          print("TARS FINAL FIRMWARE")
          print("========================================")
          print("File :", path)
          print("Size :", size, "bytes")
          print("Size :", round(size / 1024 / 1024, 2), "MB")
          print("----------------------------------------")
          print("Flash           : 4 MB")
          print("Firmware offset : 0x10000")
          print("Firmware region : 0x10000 - 0x37FFFF")
          print("LittleFS offset : 0x380000")
          print("LittleFS size   : 0x80000 (512 KB)")
          print("----------------------------------------")

          if size > 0x400000:
              raise SystemExit("ERROR: BIN melebihi 4 MB")

          if size != 0x400000:
              raise SystemExit(
                  f"ERROR: merged BIN berukuran {size} bytes, "
                  "bukan 4 MB (4194304 bytes)"
              )

          print("OK - merged BIN tepat 4 MB")
          print("OK - layout flash sesuai")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
