[env:tars]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    pschatzmann/ESP32-A2DP
    pschatzmann/arduino-audio-tools
    pschatzmann/arduino-libhelix
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

build_flags =
    -DCORE_DEBUG_LEVEL=0
