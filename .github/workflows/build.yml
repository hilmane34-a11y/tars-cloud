name: Build TARS ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Verify partition table
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFY PARTITION TABLE"
          echo "========================================"

          cat partitions.csv

          grep -Eq '^spiffs,[[:space:]]*data,[[:space:]]*spiffs,[[:space:]]*0x2A0000,[[:space:]]*0x160000' partitions.csv || {
            echo "ERROR: Partisi LittleFS tidak sesuai!"
            echo "Harus:"
            echo "spiffs,data,spiffs,0x2A0000,0x160000"
            exit 1
          }

          echo "OK - partisi LittleFS sesuai"

      - name: Prepare LittleFS
        shell: bash
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Build TARS firmware
        run: |
          pio run -e tars

      - name: Build LittleFS
        run: |
          pio run -e tars -t buildfs

      - name: Locate ESP32 tools
        shell: bash
        run: |
          FRAMEWORK="$HOME/.platformio/packages/framework-arduinoespressif32"
          ESPTOOL="$HOME/.platformio/packages/tool-esptoolpy/esptool.py"

          BOOTLOADER_ELF="$FRAMEWORK/tools/sdk/esp32/bin/bootloader_dio_40m.elf"
          BOOT_APP0="$FRAMEWORK/tools/partitions/boot_app0.bin"

          test -f "$BOOTLOADER_ELF" || {
            echo "ERROR: bootloader_dio_40m.elf tidak ditemukan"
            exit 1
          }

          test -f "$BOOT_APP0" || {
            echo "ERROR: boot_app0.bin tidak ditemukan"
            exit 1
          }

          test -f "$ESPTOOL" || {
            echo "ERROR: esptool.py tidak ditemukan"
            exit 1
          }

          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "BOOTLOADER_ELF=$BOOTLOADER_ELF" >> "$GITHUB_ENV"
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "ESPTOOL=$ESPTOOL" >> "$GITHUB_ENV"

      - name: Convert bootloader ELF to BIN
        shell: bash
        run: |
          python "$ESPTOOL" \
            --chip esp32 \
            elf2image \
            "$BOOTLOADER_ELF" \
            -o bootloader.bin

          test -f bootloader.bin

      - name: Verify build files
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          test -f bootloader.bin
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/littlefs.bin"
          test -f "$BOOT_APP0"

          echo "Build files:"
          ls -lh bootloader.bin
          ls -lh "$BUILD/partitions.bin"
          ls -lh "$BUILD/firmware.bin"
          ls -lh "$BUILD/littlefs.bin"
          ls -lh "$BOOT_APP0"

      - name: Merge TARS firmware
        shell: bash
        run: |
          BUILD=".pio/build/tars"

          python "$ESPTOOL" \
            --chip esp32 \
            merge_bin \
            -o TARS-ESP32.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader.bin \
            0x8000 "$BUILD/partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin" \
            0x2A0000 "$BUILD/littlefs.bin"

      - name: Verify final BIN
        shell: bash
        run: |
          python - <<'PY'
          import os

          path = "TARS-ESP32.bin"
          size = os.path.getsize(path)

          print("========================================")
          print("TARS FINAL FIRMWARE")
          print("========================================")
          print("File :", path)
          print("Size :", size, "bytes")
          print("Size :", round(size / 1024 / 1024, 2), "MB")

          if size > 0x400000:
              raise SystemExit("ERROR: BIN melebihi 4 MB")

          if size != 0x400000:
              raise SystemExit("ERROR: merged BIN bukan 4 MB penuh")

          print("OK - merged BIN tepat 4 MB")
          print("LittleFS offset : 0x2A0000")
          print("LittleFS size   : 0x160000")
          print("Flash address   : 0x0000")
          PY

      - name: Upload TARS firmware
        uses: actions/upload-artifact@v4
        with:
          name: TARS-ESP32
          path: TARS-ESP32.bin
          if-no-files-found: error
